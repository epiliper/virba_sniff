repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-virba_sniff_logo_light.png
    - docs/images/nf-core-virba_sniff_logo_light.png
    - docs/images/nf-core-virba_sniff_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - LICENSE
    - .github/PULL_REQUEST_TEMPLATE.md
    - docs/CONTRIBUTING.md
    - assets/sendmail_template.txt
  nextflow_config: false
  nf_test_content: false
  multiqc_config: false
  files_exist:
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-virba_sniff_logo_light.png
    - docs/images/nf-core-virba_sniff_logo_light.png
    - docs/images/nf-core-virba_sniff_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - LICENSE
    - CHANGELOG.md
    - conf/test.config
    - conf/test_full.config
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - assets/multiqc_config.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: glab
  name: virba_sniff
  description: An end-to-end pipeline for analyzing viruses and bacteria in metagenomic
    sequencing data
  author: "Eli "
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - changelog
    - license
    - ci
    - test_config
    - nf-test
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - codespaces
    - vscode
  is_nfcore: false
